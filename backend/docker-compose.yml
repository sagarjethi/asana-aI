services:
  postgres:
    image: postgres:16-alpine
    container_name: asanaai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asanaai
      POSTGRES_PASSWORD: asanaai
      POSTGRES_DB: asanaai
    ports:
      - '5432:5432'
    volumes:
      - asanaai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U asanaai']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: asanaai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://asanaai:asanaai@postgres:5432/asanaai
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me}
      LOG_LEVEL: info
    ports:
      - '8080:8080'

volumes:
  asanaai_pgdata:
